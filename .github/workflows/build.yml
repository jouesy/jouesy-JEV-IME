name: JEV Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure offline engine checks
        run: cmake -S . -B build_portable -DJEV_PORTABLE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build build_portable --parallel 4
          ctest --test-dir build_portable --output-on-failure
      - name: Package integrity checks
        shell: pwsh
        run: ./tests/JevPackageTest.ps1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native x64 and x86 and run regression tests
        shell: pwsh
        run: ./build.ps1 -Configuration Release -RunTests
      - name: Install NSIS 3.11
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Build single-file EXE installer
        shell: pwsh
        run: ./build_exe.ps1 -SkipBuild
      - name: Check EXE install and uninstall on the disposable runner
        shell: pwsh
        run: ./tests/JevInstallerTest.ps1 -InstallerPath ./dist/JEV-Setup-0.1.0-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JEV-Setup-0.1.0-win-x64
          path: |
            dist/JEV-Setup-0.1.0-win-x64.exe
            dist/JEV-Setup-0.1.0-win-x64.exe.sha256
          if-no-files-found: error
      - name: Install pinned WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          ./build_msi.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: JEV-IME-0.1.0-win-x64
          path: |
            dist/JEV-IME-0.1.0-win-x64.zip
            dist/JEV-IME-0.1.0-win-x64.msi
          if-no-files-found: error
